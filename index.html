<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Incidencias Flotilla — Chazky</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/50 p-6 rounded-2xl border border-slate-800 backdrop-blur-sm">
      <div>
        <div class="flex items-center gap-3">
          <span class="h-3 w-3 rounded-full bg-red-500 animate-pulse"></span>
          <h1 class="text-2xl font-bold tracking-tight text-white">Incidencias de Flotilla — Chazky</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Panel consolidado en tiempo real</p>
      </div>
      
      <!-- Buscador y Filtros -->
      <div class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="searchInput" oninput="filterData()" placeholder="Buscar por guía, driver, almacén..." 
               class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
        <select id="almacenFilter" onchange="filterData()" 
                class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
          <option value="">Todos los almacenes</option>
        </select>
        <select id="typeFilter" onchange="filterData()" 
                class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
          <option value="">Todos los tipos</option>
        </select>
      </div>
    </header>

    <!-- KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Incidencias</span>
        <div id="totalKpi" class="text-3xl font-bold text-white mt-1">-</div>
      </div>
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Drivers Afectados</span>
        <div id="driversKpi" class="text-3xl font-bold text-amber-400 mt-1">-</div>
      </div>
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Estado de Conexión</span>
        <div id="statusKpi" class="text-base font-semibold text-amber-400 mt-2">● Conectando con Google Sheets...</div>
      </div>
    </div>

    <!-- Rejilla -->
    <main id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-12 text-slate-500">Cargando incidencias y conductores...</div>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID = '1YIeBaG0U-EP3Ic7pIzCFU_YKwh1rIkErV3hGSdxtBZE';

    let mergedIncidents = [];

    // Parser CSV simple y robusto
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      return lines.map(line => {
        const row = [];
        let insideQuote = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            row.push(entry.trim().replace(/^"|"$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^"|"$/g, ''));
        return row;
      }).filter(row => row.some(cell => cell !== ''));
    }

    async function loadAllData() {
      try {
        // Cargar Pestaña Guias y Pestaña DRIVERS en paralelo
        const urlGuias = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Guias`;
        const urlDrivers = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=DRIVERS`;

        const [resGuias, resDrivers] = await Promise.all([
          fetch(urlGuias).then(r => r.text()),
          fetch(urlDrivers).then(r => r.text())
        ]);

        const rowsGuias = parseCSV(resGuias);
        const rowsDrivers = parseCSV(resDrivers);

        // Mapa de almacenes desde DRIVERS
        const driversMap = {};
        rowsDrivers.forEach((row, idx) => {
          if (idx === 0) return; // Ignorar encabezado
          const name = row[0] ? row[0].trim().toLowerCase() : '';
          const nameAlt = row[1] ? row[1].trim().toLowerCase() : '';
          
          // Buscar columna de almacén (Toreo/Sur)
          const almacen = row.find(c => c.toLowerCase().includes('toreo') || c.toLowerCase().includes('sur')) || row[1] || row[2] || 'Sin Almacén';
          
          if (name) driversMap[name] = almacen;
          if (nameAlt) driversMap[nameAlt] = almacen;
        });

        // Construir datos de Incidencias
        mergedIncidents = [];
        rowsGuias.forEach((row, idx) => {
          if (idx === 0) return; // Saltar encabezado
          const guia = row[0] || '';
          const driver = row[1] || 'Sin asignar';
          const fecha = row[2] || 'N/A';
          const descripcion = row[3] || 'Sin comentarios';
          const tipo = row[4] || 'Incidencia General';

          if (guia && guia.toLowerCase() !== 'guía' && guia.toLowerCase() !== 'guia') {
            const driverKey = driver.trim().toLowerCase();
            const almacen = driversMap[driverKey] || 'No especificado';

            mergedIncidents.push({ guia, driver, fecha, descripcion, tipo, almacen });
          }
        });

        if (mergedIncidents.length === 0) {
          showError('No se encontraron guías en la hoja. Verifica que la pestaña se llame "Guias".');
          return;
        }

        document.getElementById('statusKpi').className = 'text-base font-semibold text-emerald-400 mt-2';
        document.getElementById('statusKpi').textContent = '● Conectado (Guias + DRIVERS)';

        populateDropdowns();
        renderCards(mergedIncidents);
        updateKPIs(mergedIncidents);

      } catch (err) {
        console.error(err);
        showError('Error al leer las hojas. Verifica que el archivo de Google Sheets tenga el acceso general en "Cualquier persona con el enlace".');
      }
    }

    function showError(msg) {
      document.getElementById('cardsGrid').innerHTML = `
        <div class="col-span-full bg-red-950/30 border border-red-800/50 p-6 rounded-xl text-red-400 text-center">
          ${msg}
        </div>`;
      document.getElementById('statusKpi').className = 'text-base font-semibold text-red-400 mt-2';
      document.getElementById('statusKpi').textContent = '● Error de conexión';
    }

    function renderCards(items) {
      const grid = document.getElementById('cardsGrid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No se encontraron incidencias con los filtros aplicados.</div>`;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition-all flex flex-col justify-between gap-4 shadow-lg shadow-black/40">
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-2">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
                ${item.tipo}
              </span>
              <span class="text-xs text-slate-500 font-mono">${item.fecha}</span>
            </div>

            <div class="flex justify-between items-end gap-2">
              <div>
                <span class="text-[10px] font-bold text-slate-500 tracking-wider uppercase">Número de Guía</span>
                <p class="text-lg font-bold text-slate-100 font-mono tracking-wide">${item.guia}</p>
              </div>
              <span class="px-2.5 py-1 rounded-lg text-xs font-semibold ${
                item.almacen.toLowerCase().includes('toreo') 
                  ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' 
                  : item.almacen.toLowerCase().includes('sur') 
                  ? 'bg-blue-500/10 text-blue-400 border border-blue-500/30' 
                  : 'bg-slate-800 text-slate-400 border border-slate-700'
              }">
                📍 ${item.almacen}
              </span>
            </div>

            <div class="flex items-center gap-2 pt-1">
              <div class="h-6 w-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs font-bold">
                ${String(item.driver).charAt(0)}
              </div>
              <span class="text-sm font-medium text-slate-300">${item.driver}</span>
            </div>
          </div>

          <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800/80 text-xs text-slate-400 whitespace-pre-line">
            <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Comentarios / Descripción:</span>
            ${item.descripcion}
          </div>
        </div>
      `).join('');
    }

    function populateDropdowns() {
      // Tipos
      const types = [...new Set(mergedIncidents.map(i => i.tipo))].filter(Boolean);
      const selectType = document.getElementById('typeFilter');
      selectType.innerHTML = '<option value="">Todos los tipos</option>';
      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        selectType.appendChild(opt);
      });

      // Almacenes
      const almacenes = [...new Set(mergedIncidents.map(i => i.almacen))].filter(Boolean);
      const selectAlmacen = document.getElementById('almacenFilter');
      selectAlmacen.innerHTML = '<option value="">Todos los almacenes</option>';
      almacenes.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        selectAlmacen.appendChild(opt);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedType = document.getElementById('typeFilter').value;
      const selectedAlmacen = document.getElementById('almacenFilter').value;

      const filtered = mergedIncidents.filter(item => {
        const matchesQuery = String(item.guia).toLowerCase().includes(query) || 
                             String(item.driver).toLowerCase().includes(query) ||
                             String(item.descripcion).toLowerCase().includes(query) ||
                             String(item.almacen).toLowerCase().includes(query);
        const matchesType = !selectedType || item.tipo === selectedType;
        const matchesAlmacen = !selectedAlmacen || item.almacen === selectedAlmacen;
        return matchesQuery && matchesType && matchesAlmacen;
      });

      renderCards(filtered);
      updateKPIs(filtered);
    }

    function updateKPIs(items) {
      document.getElementById('totalKpi').textContent = items.length;
      const uniqueDrivers = new Set(items.map(i => i.driver)).size;
      document.getElementById('driversKpi').textContent = uniqueDrivers;
    }

    loadAllData();
  </script>
</body>
</html>
