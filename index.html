<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; font-family: system-ui, -apple-system, sans-serif;">

  <!-- KPI 1: PEOR DRIVER -->
  <div style="background-color: #0f172a; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 16px; padding: 20px; color: #ffffff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span style="font-size: 11px; font-weight: 700; color: #f87171; text-transform: uppercase; letter-spacing: 0.5px;">🚨 Peor Driver (Top 1)</span>
      <span style="font-size: 9px; font-weight: 800; background-color: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.4);">REINCIDENTE</span>
    </div>
    <div id="kpiWorstDriverName" style="font-size: 22px; font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      Luis Angel Luna
    </div>
    <p id="kpiWorstDriverCount" style="font-size: 13px; color: #94a3b8; margin-top: 6px;">
      <span style="color: #f87171; font-weight: 700;">13</span> incidencias registradas
    </p>
  </div>

  <!-- KPI 2: CONCENTRACIÓN -->
  <div style="background-color: #0f172a; border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 16px; padding: 20px; color: #ffffff;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 11px; font-weight: 700; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.5px;">📈 Concentración Impacto</span>
      <span style="font-size: 16px;">⚠️</span>
    </div>
    <div id="kpiConcentrationRate" style="font-size: 32px; font-weight: 800; color: #fbbf24; margin-top: 4px;">
      100%
    </div>
    <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Acumuladas en 1 solo repartidor</p>
  </div>

  <!-- KPI 3: INCIDENCIA PRINCIPAL -->
  <div style="background-color: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; color: #ffffff;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <span style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">⚙️ Incidencia Principal</span>
      <span style="font-size: 16px;">📄</span>
    </div>
    <div id="kpiTopFalla" style="font-size: 17px; font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      Terceros sin evidencia
    </div>
    <p id="kpiTopFallaDetail" style="font-size: 12px; color: #94a3b8; margin-top: 6px;">
      84.6% del total (11 casos)
    </p>
  </div>

  <!-- KPI 4: EVIDENCIA INCOMPLETA -->
  <div style="background-color: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; color: #ffffff;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">🔍 Evidencia Incompleta</span>
      <span style="font-size: 16px;">📷</span>
    </div>
    <div id="kpiSecondFalla" style="font-size: 32px; font-weight: 800; color: #c084fc; margin-top: 4px;">
      15.4%
    </div>
    <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Solo 1 evidencia cargada (2 casos)</p>
  </div>

</div>
