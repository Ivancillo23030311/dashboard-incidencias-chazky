<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Incidencias Flotilla — Chazky</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/50 p-6 rounded-2xl border border-slate-800 backdrop-blur-sm">
      <div>
        <div class="flex items-center gap-3">
          <span class="h-3 w-3 rounded-full bg-red-500 animate-pulse"></span>
          <h1 class="text-2xl font-bold tracking-tight text-white">Incidencias de Flotilla — Chazky</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Panel consolidado de Guías y Drivers</p>
      </div>
      
      <!-- Buscador y Filtros -->
      <div class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="searchInput" oninput="filterData()" placeholder="Buscar por guía, driver, almacén..." 
               class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
        <select id="almacenFilter" onchange="filterData()" 
                class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
          <option value="">Todos los almacenes</option>
          <option value="Toreo">Toreo</option>
          <option value="Sur">Sur</option>
        </select>
        <select id="typeFilter" onchange="filterData()" 
                class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
          <option value="">Todos los tipos</option>
        </select>
      </div>
    </header>

    <!-- KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Incidencias</span>
        <div id="totalKpi" class="text-3xl font-bold text-white mt-1">-</div>
      </div>
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Drivers Afectados</span>
        <div id="driversKpi" class="text-3xl font-bold text-amber-400 mt-1">-</div>
      </div>
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Estado de Conexión</span>
        <div id="statusKpi" class="text-base font-semibold text-amber-400 mt-2">● Cargando datos...</div>
      </div>
    </div>

    <!-- Rejilla -->
    <main id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-12 text-slate-500">Cargando y vinculando datos...</div>
    </main>
  </div>

  <script>
    const SPREADSHEET_ID = '1YIeBaG0U-EP3Ic7pIzCFU_YKwh1rIkErV3hGSdxtBZE';
    
    // IDs numéricos de pestañas (gid) para evitar errores de nombre
    const GID_GUIAS = '1995934926'; 
    const GID_DRIVERS = '0'; 

    let guiasData = [];
    let driversMap = {};
    let mergedIncidents = [];
    let guiasLoaded = false;
    let driversLoaded = false;

    // 1. Manejador de pestaña Guias
    window.handleGuiasData = function(response) {
      guiasLoaded = true;
      if (response && response.table && response.table.rows) {
        guiasData = response.table.rows.map(r => {
          const c = r.c || [];
          return {
            guia: c[0] ? (c[0].v !== null ? c[0].v : c[0].f) : '',
            driver: c[1] ? (c[1].v !== null ? c[1].v : c[1].f) : 'Sin asignar',
            fecha: c[2] ? (c[2].f || c[2].v) : 'N/A',
            descripcion: c[3] ? (c[3].v !== null ? c[3].v : c[3].f) : 'Sin comentarios',
            tipo: c[4] ? (c[4].v !== null ? c[4].v : c[4].f) : 'Incidencia General'
          };
        }).filter(item => item.guia && String(item.guia).toLowerCase() !== 'guía' && String(item.guia).toLowerCase() !== 'guia');
      }
      checkAndMerge();
    };

    // 2. Manejador de pestaña DRIVERS
    window.handleDriversData = function(response) {
      driversLoaded = true;
      if (response && response.table && response.table.rows) {
        response.table.rows.forEach(r => {
          const c = r.c || [];
          // Busca el nombre del driver o guía en cualquier columna inicial
          const col0 = c[0] ? String(c[0].v || c[0].f || '').trim().toLowerCase() : '';
          const col1 = c[1] ? String(c[1].v || c[1].f || '').trim() : '';
          const col2 = c[2] ? String(c[2].v || c[2].f || '').trim() : '';

          if (col0) {
            // Asigna el almacén si se encuentra en col1 o col2
            driversMap[col0] = col1 || col2 || 'Sin Almacén';
          }
        });
      }
      checkAndMerge();
    };

    // 3. Unificar datos
    function checkAndMerge() {
      if (!guiasLoaded) return; // Espera al menos la carga principal

      mergedIncidents = guiasData.map(item => {
        const driverKey = String(item.driver).trim().toLowerCase();
        const guiaKey = String(item.guia).trim().toLowerCase();
        
        // Busca coincidencias de almacén por Driver o por Guía
        let almacen = driversMap[driverKey] || driversMap[guiaKey] || 'No especificado';

        return { ...item, almacen };
      });

      if (mergedIncidents.length === 0) {
        showError('No se encontraron registros activos en la hoja de Guías.');
        return;
      }

      document.getElementById('statusKpi').className = 'text-base font-semibold text-emerald-400 mt-2';
      document.getElementById('statusKpi').textContent = '● Conectado (Guias + DRIVERS)';
      populateTypeDropdown();
      renderCards(mergedIncidents);
      updateKPIs(mergedIncidents);
    }

    function initMultiFetch() {
      // Intentar cargar Guias por GID
      const s1 = document.createElement('script');
      s1.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID_GUIAS}&tqx=responseHandler:handleGuiasData`;
      s1.onerror = () => {
        // Fallback por nombre si el GID falla
        const s1_alt = document.createElement('script');
        s1_alt.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=Guias&tqx=responseHandler:handleGuiasData`;
        document.body.appendChild(s1_alt);
      };
      document.body.appendChild(s1);

      // Intentar cargar DRIVERS por GID
      const s2 = document.createElement('script');
      s2.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID_DRIVERS}&tqx=responseHandler:handleDriversData`;
      s2.onerror = () => {
        // Fallback por nombre
        const s2_alt = document.createElement('script');
        s2_alt.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=DRIVERS&tqx=responseHandler:handleDriversData`;
        document.body.appendChild(s2_alt);
      };
      document.body.appendChild(s2);
    }

    function showError(msg) {
      document.getElementById('cardsGrid').innerHTML = `
        <div class="col-span-full bg-red-950/30 border border-red-800/50 p-6 rounded-xl text-red-400 text-center">
          ${msg}
        </div>`;
      document.getElementById('statusKpi').className = 'text-base font-semibold text-red-400 mt-2';
      document.getElementById('statusKpi').textContent = '● Error de conexión';
    }

    function renderCards(items) {
      const grid = document.getElementById('cardsGrid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No se encontraron incidencias con ese filtro.</div>`;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition-all flex flex-col justify-between gap-4 shadow-lg shadow-black/40">
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-2">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
                ${item.tipo}
              </span>
              <span class="text-xs text-slate-500 font-mono">${item.fecha}</span>
            </div>

            <div class="flex justify-between items-end">
              <div>
                <span class="text-[10px] font-bold text-slate-500 tracking-wider uppercase">Número de Guía</span>
                <p class="text-lg font-bold text-slate-100 font-mono tracking-wide">${item.guia}</p>
              </div>
              <span class="px-2.5 py-1 rounded-lg text-xs font-semibold ${
                item.almacen.toLowerCase().includes('toreo') 
                  ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' 
                  : item.almacen.toLowerCase().includes('sur') 
                  ? 'bg-blue-500/10 text-blue-400 border border-blue-500/30' 
                  : 'bg-slate-800 text-slate-400 border border-slate-700'
              }">
                📍 ${item.almacen}
              </span>
            </div>

            <div class="flex items-center gap-2 pt-1">
              <div class="h-6 w-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs font-bold">
                ${String(item.driver).charAt(0)}
              </div>
              <span class="text-sm font-medium text-slate-300">${item.driver}</span>
            </div>
          </div>

          <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800/80 text-xs text-slate-400 whitespace-pre-line">
            <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Comentarios / Descripción:</span>
            ${item.descripcion}
          </div>
        </div>
      `).join('');
    }

    function populateTypeDropdown() {
      const types = [...new Set(mergedIncidents.map(i => i.tipo))].filter(Boolean);
      const select = document.getElementById('typeFilter');
      select.innerHTML = '<option value="">Todos los tipos</option>';
      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedType = document.getElementById('typeFilter').value;
      const selectedAlmacen = document.getElementById('almacenFilter').value.toLowerCase();

      const filtered = mergedIncidents.filter(item => {
        const matchesQuery = String(item.guia).toLowerCase().includes(query) || 
                             String(item.driver).toLowerCase().includes(query) ||
                             String(item.descripcion).toLowerCase().includes(query) ||
                             String(item.almacen).toLowerCase().includes(query);
        const matchesType = !selectedType || item.tipo === selectedType;
        const matchesAlmacen = !selectedAlmacen || item.almacen.toLowerCase().includes(selectedAlmacen);
        return matchesQuery && matchesType && matchesAlmacen;
      });

      renderCards(filtered);
      updateKPIs(filtered);
    }

    function updateKPIs(items) {
      document.getElementById('totalKpi').textContent = items.length;
      const uniqueDrivers = new Set(items.map(i => i.driver)).size;
      document.getElementById('driversKpi').textContent = uniqueDrivers;
    }

    initMultiFetch();
  </script>
</body>
</html>
