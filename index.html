<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Incidencias Flotilla — Chazky</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header principal -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/50 p-6 rounded-2xl border border-slate-800 backdrop-blur-sm">
      <div>
        <div class="flex items-center gap-3">
          <span class="h-3 w-3 rounded-full bg-red-500 animate-pulse"></span>
          <h1 class="text-2xl font-bold tracking-tight text-white">Incidencias de Flotilla — Chazky</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Panel interactivo en tiempo real</p>
      </div>
      
      <!-- Buscador y Filtros -->
      <div class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="searchInput" oninput="filterData()" placeholder="Buscar por guía, driver..." 
               class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
        <select id="typeFilter" onchange="filterData()" 
                class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50">
          <option value="">Todos los tipos de incidencia</option>
        </select>
      </div>
    </header>

    <!-- Métricas Rápidas (KPIs) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total de Registros</span>
        <div id="totalKpi" class="text-3xl font-bold text-white mt-1">-</div>
      </div>
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Drivers Afectados</span>
        <div id="driversKpi" class="text-3xl font-bold text-amber-400 mt-1">-</div>
      </div>
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Estado de Conexión</span>
        <div id="statusKpi" class="text-base font-semibold text-emerald-400 mt-2">● Conectado a Google Sheet</div>
      </div>
    </div>

    <!-- Feed de Tarjetas Tipo Lovable -->
    <main id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-12 text-slate-500">Cargando incidencias de Google Sheets...</div>
    </main>
  </div>

  <script>
    const SHEET_ID = '1YIeBaG0U-EP3Ic7pIzCFU_YKwh1rIkErV3hGSdxtBZE';
    let rawIncidents = [];

    // Función callback global llamada automáticamente por la API de Google
    window.handleSheetResponse = function(response) {
      if (!response.table || !response.table.rows) {
        showError('No se encontraron datos válidos en la hoja.');
        return;
      }

      const rows = response.table.rows;
      rawIncidents = rows.map(r => {
        const c = r.c || [];
        return {
          guia: c[0] ? (c[0].v || c[0].f || 'N/A') : 'N/A',
          driver: c[1] ? (c[1].v || c[1].f || 'Sin asignar') : 'Sin asignar',
          fecha: c[2] ? (c[2].f || c[2].v || 'N/A') : 'N/A',
          descripcion: c[3] ? (c[3].v || c[3].f || 'Sin comentarios') : 'Sin comentarios',
          tipo: c[4] ? (c[4].v || c[4].f || 'Incidencia General') : 'Incidencia General'
        };
      });

      populateTypeDropdown();
      renderCards(rawIncidents);
      updateKPIs(rawIncidents);
    };

    function loadSheetData() {
      // Inyección mediante script tag (evita problemas de CORS)
      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetResponse`;
      script.onerror = () => showError('Error de conexión con Google Sheets. Verifica los permisos de acceso.');
      document.body.appendChild(script);
    }

    function showError(msg) {
      document.getElementById('cardsGrid').innerHTML = `
        <div class="col-span-full bg-red-950/30 border border-red-800/50 p-6 rounded-xl text-red-400 text-center">
          ${msg}
        </div>`;
    }

    function renderCards(items) {
      const grid = document.getElementById('cardsGrid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No se encontraron incidencias.</div>`;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition-all flex flex-col justify-between gap-4 shadow-lg shadow-black/40">
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-2">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
                ${item.tipo}
              </span>
              <span class="text-xs text-slate-500 font-mono">${item.fecha}</span>
            </div>

            <div>
              <span class="text-[10px] font-bold text-slate-500 tracking-wider uppercase">Número de Guía</span>
              <p class="text-lg font-bold text-slate-100 font-mono tracking-wide">${item.guia}</p>
            </div>

            <div class="flex items-center gap-2 pt-1">
              <div class="h-6 w-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs font-bold">
                ${String(item.driver).charAt(0)}
              </div>
              <span class="text-sm font-medium text-slate-300">${item.driver}</span>
            </div>
          </div>

          <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800/80 text-xs text-slate-400 whitespace-pre-line">
            <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Comentarios / Descripción:</span>
            ${item.descripcion}
          </div>
        </div>
      `).join('');
    }

    function populateTypeDropdown() {
      const types = [...new Set(rawIncidents.map(i => i.tipo))].filter(Boolean);
      const select = document.getElementById('typeFilter');
      select.innerHTML = '<option value="">Todos los tipos de incidencia</option>';
      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedType = document.getElementById('typeFilter').value;

      const filtered = rawIncidents.filter(item => {
        const matchesQuery = String(item.guia).toLowerCase().includes(query) || 
                             String(item.driver).toLowerCase().includes(query) ||
                             String(item.descripcion).toLowerCase().includes(query);
        const matchesType = !selectedType || item.tipo === selectedType;
        return matchesQuery && matchesType;
      });

      renderCards(filtered);
      updateKPIs(filtered);
    }

    function updateKPIs(items) {
      document.getElementById('totalKpi').textContent = items.length;
      const uniqueDrivers = new Set(items.map(i => i.driver)).size;
      document.getElementById('driversKpi').textContent = uniqueDrivers;
    }

    loadSheetData();
  </script>
</body>
</html>
